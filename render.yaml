# Render Blueprint: New > Blueprint > pick this repo. Deploys on every push to main.
services:
  - type: web
    name: gokwik-d2c-benchmark-mcp
    runtime: python
    plan: starter            # 'free' works but sleeps when idle; first Claude call then times out
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
